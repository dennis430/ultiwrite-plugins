name: Validate plugin distribution

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Structural and secret checks
        run: node scripts/validate-public-plugins.mjs
      - name: Client protocol and credential handling
        run: node --test client/test/cli.test.mjs client/test/transport.test.mjs
      - name: Reproduce Cursor submission archive
        run: python scripts/build-cursor-release.py dist
