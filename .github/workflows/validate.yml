name: Validate plugin distribution

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Structural and secret checks
        run: node scripts/validate-public-plugins.mjs
      - name: Release archive and source parity
        run: node scripts/pack-public-connectors.mjs --check

  cli:
    name: CLI / ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install declared dependencies
        run: npm ci --ignore-scripts
      - name: Check executable syntax
        run: npm run build
      - name: Test installer and existing client
        run: npm test
      - name: Test the packed npm install in isolation
        run: npm run test:package
