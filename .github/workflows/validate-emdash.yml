name: Validate EmDash connector
on:
  push:
    branches: [feat/emdash-ultiwrite-connector]
    paths: ['emdash/**', '.github/workflows/validate-emdash.yml']
  pull_request:
    paths: ['emdash/**', '.github/workflows/validate-emdash.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: emdash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned official CLI
        run: npm install --no-audit --no-fund
      - name: Test, validate and bundle without credentials
        run: npm run verify
      - name: Upload source, lockfile and built registry archive
        uses: actions/upload-artifact@v4
        with:
          name: Ultiwrite_EmDash_Plugin_v0.1.0
          include-hidden-files: true
          if-no-files-found: error
          path: |
            emdash/
            !emdash/node_modules/
